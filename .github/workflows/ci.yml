name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (app)
        run: npx tsc --noEmit
      - name: Typecheck (scripts)
        run: npm run typecheck:scripts
      - run: npm run lint
      - name: Unit tests
        run: npm test
